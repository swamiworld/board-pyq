<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board PYQ – Computer Science Review</title>
<script src="questions_cs.js"></script>
<style>
  :root { --bg:#fbf7ef; --card:#fff; --ink:#24213a; --muted:#6b6880; --accent:#4f46e5; --ok:#15803d; --okbg:#e8f6ec; --line:#e7e1d4; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16142a; --card:#211f3a; --ink:#ece9ff; --muted:#a6a3c4; --accent:#a5b4fc; --ok:#86efac; --okbg:#1d3a2a; --line:#34315a; } }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, sans-serif }
  header { position:sticky; top:0; background:var(--bg); border-bottom:1px solid var(--line); padding:12px 16px; z-index:2 }
  h1 { font-size:18px; margin:0 0 8px }
  .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center }
  select, input { font:inherit; padding:6px 8px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); max-width:100% }
  main { max-width:820px; margin:0 auto; padding:16px }
  .q { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin:0 0 14px }
  .meta { font-size:13px; color:var(--muted); margin-bottom:6px }
  .id { font-weight:600; color:var(--accent) }
  .text { white-space:pre-line; margin-bottom:8px; overflow-x:auto }
  .opts { list-style:none; padding:0; margin:0 0 8px; display:grid; gap:4px }
  .opts li { padding:4px 8px; border-radius:8px; overflow-x:auto }
  .opts li.ans { background:var(--okbg); color:var(--ok); font-weight:600 }
  .fig { max-width:100%; height:auto; border:1px solid var(--line); border-radius:8px; margin:4px 0 8px; background:#fff }
  .small { font-size:14px; color:var(--muted) }
  .small b { color:var(--ink) }
  .note { font-size:13px; color:#b45309 }
  .count { font-size:14px; color:var(--muted) }
  pre.code, code { font-family: ui-monospace, Consolas, monospace; font-size:14px }
  pre.code { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px; overflow-x:auto; white-space:pre; margin:6px 0 }
</style>
</head>
<body>
<header>
  <h1>Board PYQ · Class 12 Computer Science · Section A question review</h1>
  <div class="bar">
    <select id="ch" aria-label="Chapter"></select>
    <input id="find" type="search" placeholder="Search text or id" aria-label="Search">
    <span class="count" id="count"></span>
  </div>
</header>
<main id="list"></main>
<script>
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function math(s) {
  return String(s).split('```').map((p, i) => {
    if (i % 2 === 1) { const nl = p.indexOf('\n'); const code = nl >= 0 && /^[a-z]*$/.test(p.slice(0, nl)) ? p.slice(nl + 1) : p;
      return '<pre class="code">' + esc(code.replace(/\n$/, '')) + '</pre>'; }
    return p.split('`').map((t, j) => j % 2 ? '<code>' + esc(t) + '</code>' : esc(t)).join('');
  }).join('');
}
const P = window.PYQ_CS, sel = document.getElementById('ch');
sel.innerHTML = '<option value="0">All chapters (' + P.questions.length + ')</option>' +
  P.chapters.map(c => `<option value="${c.n}">Ch ${c.n}: ${esc(c.t)} (${c.count})</option>`).join('');
const src = q => q.sources.map(s => `${s[0]} ${s[1] === 'R' ? 'Regular' : 'Comptt'} ${s[2]} Q${s[3]}`).join(' · ');
function render() {
  const ch = +sel.value, f = document.getElementById('find').value.trim().toLowerCase();
  const qs = P.questions.filter(q => (!ch || q.chapter === ch) && (!f || q.id.includes(f) || q.text.toLowerCase().includes(f)));
  document.getElementById('count').textContent = qs.length + ' shown';
  document.getElementById('list').innerHTML = qs.map(q => `
    <div class="q">
      <div class="meta"><span class="id">${q.id}</span> · Ch ${q.chapter} · ${q.type === 'ar' ? 'Assertion–Reason' : q.type === 'tf' ? 'True/False' : 'MCQ'} · difficulty ${q.difficulty}<br>${esc(src(q))}</div>
      <div class="text">${math(q.text)}</div>
      ${q.figure ? `<img class="fig" src="${q.figure}" alt="Figure for ${q.id}">` : ''}
      <ul class="opts">${Object.keys(q.options).map(k => `<li class="${k === q.answer ? 'ans' : ''}">(${k}) ${math(q.options[k])}</li>`).join('')}</ul>
      <div class="small"><b>Hint:</b> ${math(q.hint)}</div>
      <div class="small"><b>Explanation:</b> ${math(q.explanation)}</div>
      ${q.note ? `<div class="note">${esc(q.note)}</div>` : ''}
    </div>`).join('');
}
sel.onchange = render; document.getElementById('find').oninput = render; render();
</script>
</body>
</html>
